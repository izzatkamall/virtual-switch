# example config for the switch, use: ./switch 9000 4 switch.conf
# send SIGHUP to the switch to reload it after editing

mac_age 30        # seconds before an unused mac is forgotten
mac_max 1024      # most entries in the mac table
mac_per_port 16   # more macs than this on one port and the port is shut
port_wait 5       # seconds a new host waits for a free port
